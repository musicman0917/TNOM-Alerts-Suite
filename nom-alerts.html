<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NOM Alerts</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* ─── Disney Theme ─────────────────────────────────── */
  body[data-theme="disney"] {
    --amber:      #FFD700;
    --warm:       #FFF0A0;
    --cream:      #FFF8DC;
    --muted:      #D4AAFF;
    --dark-muted: #9B7FCC;
    --border:     #7B2FBE;
    --glow-rgba:  rgba(155,89,182,.6);
  }

  body[data-theme="disney"] .card {
    background: linear-gradient(155deg, #1a0a2e, #0d0620) !important;
    border-color: #7B2FBE !important;
    box-shadow: 0 0 30px rgba(155,89,182,.4), 0 8px 32px rgba(0,0,0,.8) !important;
  }

  body[data-theme="disney"] .accent {
    background: linear-gradient(90deg, #9B59B6, #FFD700) !important;
  }

  body[data-theme="disney"] #top-left-widgets {
    border-color: rgba(123,47,190,.5) !important;
    background: rgba(13,6,32,.88) !important;
  }

  body[data-theme="disney"] .circle-fill {
    stroke: #9B59B6 !important;
    filter: drop-shadow(0 0 8px rgba(155,89,182,.7)) !important;
  }

  body[data-theme="disney"] .circle-track {
    stroke: rgba(155,89,182,.2) !important;
  }

  body[data-theme="disney"] .health-fill.steps {
    background: linear-gradient(to right, #4A0080, #9B59B6) !important;
  }

  body[data-theme="disney"] .health-fill.water {
    background: linear-gradient(to right, #1A0050, #7B2FBE) !important;
  }

  /* Disney sparkle animation on card */
  body[data-theme="disney"] .card.enter {
    animation: disneyCardIn .6s cubic-bezier(.34,1.52,.64,1) forwards !important;
  }

  @keyframes disneyCardIn {
    from { opacity:0; transform:translateY(60px) scale(.9) rotate(-1deg); }
    to   { opacity:1; transform:translateY(0)    scale(1)  rotate(0deg);  }
  }

  :root {
    --card-bg-a: #2A1508;
    --card-bg-b: #180C04;
    --border:    #B87820;
    --amber:     #E89010;
    --gold:      #D4A840;
    --warm:      #F0C060;
    --cream:     #F2E4CC;
    --muted:     #C0986A;
    --dark-muted:#8A6040;
    --glow-rgba: rgba(232, 144, 16, 0.45);
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }

  /* ─── Alert Stage ──────────────────────────────────── */
  #stage {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    pointer-events: none;
  }

  /* ─── Card ─────────────────────────────────────────── */
  .card {
    position: relative;
    background:
      repeating-linear-gradient(93deg,
        transparent 0px, rgba(255,200,100,.018) 1px,
        transparent 2px, transparent 10px),
      linear-gradient(155deg, var(--card-bg-a) 0%, var(--card-bg-b) 55%, #1E1006 100%);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 18px 24px 18px 20px;
    opacity: 0;
    transform: translateY(28px) scale(0.95);
    will-change: opacity, transform;
  }

  .card.enter { animation: cardIn  .55s cubic-bezier(.34,1.52,.64,1) forwards; }
  .card.exit  { animation: cardOut .4s  ease-in              forwards; }

  @keyframes cardIn  {
    from { opacity:0; transform:translateY(60px) scale(.95); }
    to   { opacity:1; transform:translateY(0)    scale(1);   }
  }
  @keyframes cardOut {
    from { opacity:1; transform:translateY(0);    }
    to   { opacity:0; transform:translateY(60px); }
  }

  /* Outer glow */
  .card-glow {
    position: absolute; inset: -2px;
    border-radius: 4px;
    pointer-events: none;
    z-index: 0;
    transition: box-shadow .3s;
  }

  /* Corner brackets */
  .c { position:absolute; width:14px; height:14px;
       border-color: var(--gold); border-style:solid; opacity:.65; }
  .c.tl { top:5px;    left:5px;    border-width:2px 0 0 2px; }
  .c.tr { top:5px;    right:5px;   border-width:2px 2px 0 0; }
  .c.bl { bottom:5px; left:5px;    border-width:0 0 2px 2px; }
  .c.br { bottom:5px; right:5px;   border-width:0 2px 2px 0; }

  /* ─── Floating Notes Layer ─────────────────────────── */
  .notes-layer {
    position: absolute; inset:0;
    overflow: hidden; pointer-events:none; z-index:1;
    border-radius: 3px;
  }
  .fn {
    position: absolute;
    color: var(--gold);
    opacity: 0;
    animation: floatUp 3.5s ease-in-out forwards;
    animation-delay: var(--d, 0s);
    font-size: var(--sz, 14px);
  }
  @keyframes floatUp {
    0%   { opacity:0;   transform: translateY(0)     rotate(0deg); }
    20%  { opacity:.45; }
    80%  { opacity:.15; }
    100% { opacity:0;   transform: translateY(-70px) rotate(25deg); }
  }

  /* ─── Main Row ─────────────────────────────────────── */
  .row {
    position: relative; z-index:2;
    display: flex; align-items: center; gap:16px;
  }

  /* Icon */
  .icon {
    font-size: 38px;
    filter: drop-shadow(0 0 10px var(--glow-rgba));
    flex-shrink: 0;
    animation: iconPop .6s cubic-bezier(.34,1.56,.64,1);
    line-height: 1;
  }
  @keyframes iconPop {
    from { transform: scale(0.4) rotate(-15deg); opacity:0; }
    60%  { transform: scale(1.25) rotate(4deg); }
    to   { transform: scale(1)   rotate(0deg); opacity:1; }
  }

  /* Text block */
  .text { flex:1; min-width:0; }

  .label {
    font-family: 'Cinzel', serif;
    font-size: 10px; font-weight:600;
    letter-spacing: .2em; text-transform: uppercase;
    margin-bottom:3px;
    color: var(--amber);
    transition: color .3s;
  }

  .headline {
    font-family: 'Cinzel', serif;
    font-size: 21px; font-weight:700; line-height:1.15;
    color: var(--cream);
    white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow: 0 0 24px rgba(240,192,80,.35);
  }
  .headline .who {
    color: var(--warm);
    transition: color .3s;
  }

  .sub {
    font-family: 'Crimson Pro', serif;
    font-size: 14px; font-style:italic;
    color: var(--muted);
    margin-top:2px;
    white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  /* ─── Waveform ─────────────────────────────────────── */
  .waveform {
    display: flex; align-items:center; gap:3px;
    height: 44px; flex-shrink:0;
  }
  .bar {
    width: 4px; border-radius: 3px; min-height:4px;
    background: linear-gradient(to top, var(--border), var(--warm));
    animation: barPulse var(--dur, .5s) ease-in-out infinite alternate;
    animation-delay: var(--dly, 0s);
  }
  @keyframes barPulse {
    from { height: var(--lo, 5px);  opacity:.45; }
    to   { height: var(--hi, 34px); opacity:1;   }
  }

  /* ─── Message Banner ───────────────────────────────── */
  .divider {
    width:100%; height:1px;
    background: linear-gradient(to right,
      transparent, var(--border) 30%, var(--border) 70%, transparent);
    opacity:.4; margin: 10px 0 8px;
    position: relative; z-index:2;
  }
  .message {
    font-family: 'Crimson Pro', serif;
    font-size: 15px; font-style:italic;
    color: var(--muted);
    text-align:center;
    white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
    position: relative; z-index:2;
  }

  /* ─── Progress bar ─────────────────────────────────── */
  .progress-track {
    position: absolute; bottom:0; left:0; right:0;
    height: 2px;
    background: rgba(255,255,255,.06);
    border-radius: 0 0 3px 3px;
    overflow: hidden; z-index:3;
  }
  .progress-fill {
    height:100%;
    background: linear-gradient(to right, var(--border), var(--warm));
    width:100%;
    transform-origin: left;
    animation: progressDrain linear forwards;
    animation-duration: var(--pdur, 5s);
  }
  @keyframes progressDrain {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }



  /* ─── Health Bars ─────────────────────────────────────── */
  #health-widget {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-self: center;
    gap: 14px;
    pointer-events: none;
    transition: opacity .4s;
    width: 180px;
    height: 100px; /* fixed height so centering works when one bar is hidden */
  }
  #health-widget.hidden { opacity: 0; pointer-events: none; }

  .health-bar-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .health-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .health-bar-label {
    font-family: 'Cinzel', serif;
    font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--amber);
  }
  .health-bar-value {
    font-family: 'Crimson Pro', serif;
    font-size: 12px; font-style: italic;
    color: var(--muted);
  }
  .health-track {
    width: 100%; height: 8px;
    background: rgba(184,120,32,.15);
    border: 1px solid #B8782033;
    border-radius: 4px;
    overflow: hidden;
  }
  .health-fill {
    height: 100%;
    border-radius: 4px;
    width: 0%;
    transition: width 1s cubic-bezier(.4,0,.2,1);
  }
  .health-fill.steps { background: linear-gradient(to right, #8A6040, #E89010); }
  .health-fill.water { background: linear-gradient(to right, #1E4A8A, #4A9FD4); }

  /* ─── Top Left Widget Container ────────────────────── */
  #top-left-widgets {
    position: fixed;
    top: 30px; left: 30px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 20px;
    pointer-events: none;
    background: rgba(10, 4, 1, 0.88);
    border: 1px solid rgba(184, 120, 32, 0.6);
    border-radius: 6px;
    padding: 14px 18px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }

  /* ─── Poll Widget ──────────────────────────────────── */
  #poll-widget, #prediction-widget {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    background: linear-gradient(155deg, #2A1508, #180C04);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s, bottom .4s;
    box-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  #poll-widget { bottom: 100px; left: 50%; transform: translateX(-50%); }
  #prediction-widget { bottom: 100px; left: 50%; transform: translateX(-50%); }
  #poll-widget.visible { opacity: 1; }
  #prediction-widget.visible { opacity: 1; }
  /* When both visible, side by side */
  #poll-widget.stacked { left: calc(50% - 215px); transform: translateX(-100%); }
  #prediction-widget.stacked { left: calc(50% + 215px); transform: translateX(0%); }

  .pw-title {
    font-family: 'Cinzel', serif;
    font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 3px;
  }
  .pw-question {
    font-family: 'Crimson Pro', serif;
    font-size: 14px; font-weight: 600;
    color: var(--cream); margin-bottom: 8px;
  }
  .pw-choices { display: flex; flex-direction: column; gap: 5px; }

  .pw-choice {
    position: relative;
    background: rgba(0,0,0,.35);
    border: 1px solid #B8782033;
    border-radius: 3px;
    padding: 5px 8px;
    overflow: hidden;
  }
  .pw-choice-bar {
    position: absolute; inset: 0; left: 0;
    background: rgba(232,144,16,.15);
    border-radius: 3px;
    transition: width .8s ease;
    width: 0%;
  }
  .pw-choice-label {
    position: relative;
    display: flex; justify-content: space-between; align-items: center;
    font-family: 'Crimson Pro', serif; font-size: 12px;
    color: var(--cream);
  }
  .pw-choice-pct {
    font-family: 'Cinzel', serif; font-size: 10px;
    color: var(--amber);
  }
  .pw-choice-votes {
    font-style: italic; font-size: 10px; color: var(--muted);
  }

  /* Prediction colors */
  .pw-choice.blue .pw-choice-bar  { background: rgba(30,100,220,.25); }
  .pw-choice.pink .pw-choice-bar  { background: rgba(220,50,120,.25); }
  .pw-choice.blue .pw-choice-pct  { color: #6AB4FF; }
  .pw-choice.pink .pw-choice-pct  { color: #FF6AC0; }
  .pw-choice.winner { border-color: var(--amber); }
  .pw-choice.winner .pw-choice-bar { background: rgba(232,144,16,.25); }

  .pw-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px;
    font-family: 'Crimson Pro', serif; font-size: 10px;
    font-style: italic; color: var(--dark-muted);
  }
  .pw-status { color: var(--amber); font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: .15em; }

  /* ─── Hype Train Widget ─────────────────────────────── */
  #hype-train-widget {
    position: fixed;
    top: 180px; right: 30px;
    width: 220px;
    background: linear-gradient(155deg, #2A1508, #180C04);
    border: 1px solid #B87820;
    border-radius: 4px;
    padding: 10px 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s, border-color .6s, box-shadow .6s;
    box-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  #hype-train-widget.visible { opacity: 1; }

  /* Disney theme base styling (level 1) */
  body[data-theme="disney"] #hype-train-widget {
    background: linear-gradient(155deg, #1a0a2e, #0d0620);
    border-color: #7B2FBE;
    box-shadow: 0 0 20px rgba(155,89,182,.4), 0 4px 24px rgba(0,0,0,.6);
  }
  body[data-theme="disney"] .ht-title { color: #FFD700; }
  body[data-theme="disney"] .ht-level { color: #FFF0A0; text-shadow: 0 0 16px rgba(155,89,182,.6); }
  body[data-theme="disney"] .ht-track { background: rgba(155,89,182,.15); }
  body[data-theme="disney"] .ht-fill  { background: linear-gradient(to right, #9B59B6, #FFD700); }
  body[data-theme="disney"] .ht-points,
  body[data-theme="disney"] .ht-top { color: #D4AAFF; }
  body[data-theme="disney"] .ht-footer { color: #FFD700; }

  /* Level-based border/glow escalation */
  #hype-train-widget.ht-l2 { border-color: #FF8C00; box-shadow: 0 0 12px rgba(255,140,0,.3); }
  #hype-train-widget.ht-l3 { border-color: #FF4500; box-shadow: 0 0 20px rgba(255,69,0,.4); }
  #hype-train-widget.ht-l4 { border-color: #FF0080; box-shadow: 0 0 28px rgba(255,0,128,.5); animation: htPulse 1.5s ease-in-out infinite; }
  #hype-train-widget.ht-l5 { border-color: #BF00FF; box-shadow: 0 0 36px rgba(191,0,255,.6); animation: htPulse 0.8s ease-in-out infinite; }

  @keyframes htPulse {
    0%, 100% { box-shadow: 0 0 28px rgba(255,0,128,.5); }
    50%       { box-shadow: 0 0 48px rgba(255,0,255,.9); }
  }

  .ht-title {
    font-family: 'Cinzel', serif;
    font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
    color: #FF6B35; margin-bottom: 4px;
    transition: color .6s;
  }
  .ht-l2 .ht-title { color: #FF8C00; }
  .ht-l3 .ht-title { color: #FF4500; }
  .ht-l4 .ht-title { color: #FF0080; }
  .ht-l5 .ht-title { color: #BF00FF; }

  .ht-level {
    font-family: 'Cinzel', serif;
    font-size: 22px; font-weight: 700;
    color: var(--warm); line-height: 1;
    text-shadow: 0 0 16px rgba(255,107,53,.5);
    transition: font-size .4s, text-shadow .6s;
  }
  .ht-l3 .ht-level { font-size: 26px; }
  .ht-l4 .ht-level { font-size: 30px; text-shadow: 0 0 24px rgba(255,0,128,.7); }
  .ht-l5 .ht-level { font-size: 34px; text-shadow: 0 0 32px rgba(191,0,255,.9); }

  .ht-track {
    width: 100%; height: 6px;
    background: rgba(255,107,53,.15);
    border-radius: 3px; overflow: hidden;
    margin: 6px 0;
    transition: height .4s;
  }
  .ht-l4 .ht-track { height: 8px; }
  .ht-l5 .ht-track { height: 10px; }

  .ht-fill {
    height: 100%;
    background: linear-gradient(to right, #FF6B35, #FFD050);
    border-radius: 3px;
    width: 0%;
    transition: width .8s ease, background .6s;
  }
  .ht-l3 .ht-fill { background: linear-gradient(to right, #FF4500, #FF8C00); }
  .ht-l4 .ht-fill { background: linear-gradient(to right, #FF0080, #FF4500); }

  /* Disney level escalation — purple to gold to white sparkle */
  body[data-theme="disney"] .ht-l2 { border-color: #B266E0; box-shadow: 0 0 16px rgba(178,102,224,.4); }
  body[data-theme="disney"] .ht-l3 { border-color: #FFD700; box-shadow: 0 0 24px rgba(255,215,0,.5); }
  body[data-theme="disney"] .ht-l4 { border-color: #FF66CC; box-shadow: 0 0 32px rgba(255,102,204,.6); }
  body[data-theme="disney"] .ht-l5 { border-color: #FFFFFF; box-shadow: 0 0 44px rgba(255,255,255,.8); }
  body[data-theme="disney"] .ht-l2 .ht-title { color: #B266E0; }
  body[data-theme="disney"] .ht-l3 .ht-title { color: #FFD700; }
  body[data-theme="disney"] .ht-l4 .ht-title { color: #FF66CC; }
  body[data-theme="disney"] .ht-l5 .ht-title { color: #FFFFFF; }
  body[data-theme="disney"] .ht-l3 .ht-fill { background: linear-gradient(to right, #9B59B6, #FFD700); }
  body[data-theme="disney"] .ht-l4 .ht-fill { background: linear-gradient(to right, #FFD700, #FF66CC); }
  body[data-theme="disney"] .ht-l5 .ht-fill { background: linear-gradient(to right, #FF66CC, #FFFFFF); }
  body[data-theme="disney"] .ht-l4 .ht-footer { color: #FF66CC; }
  body[data-theme="disney"] .ht-l5 .ht-footer { color: #FFFFFF; }
  .ht-l5 .ht-fill { background: linear-gradient(to right, #BF00FF, #FF0080); }

  .ht-points {
    font-family: 'Crimson Pro', serif;
    font-size: 11px; font-style: italic;
    color: var(--muted); margin-bottom: 6px;
  }
  .ht-top {
    font-family: 'Crimson Pro', serif;
    font-size: 11px; color: var(--dark-muted);
  }
  .ht-footer {
    font-family: 'Cinzel', serif;
    font-size: 8px; letter-spacing: .12em;
    color: #FF6B35; margin-top: 6px;
    transition: color .6s;
  }
  .ht-l4 .ht-footer { color: #FF0080; }
  .ht-l5 .ht-footer { color: #BF00FF; }

  .ht-hype-msg {
    font-family: 'Crimson Pro', serif;
    font-size: 12px; font-style: italic; font-weight: 600;
    margin-top: 4px; display: none;
  }
  .ht-l3 .ht-hype-msg, .ht-l4 .ht-hype-msg, .ht-l5 .ht-hype-msg { display: block; }
  .ht-l3 .ht-hype-msg { color: #FF4500; }
  .ht-l4 .ht-hype-msg { color: #FF0080; }
  .ht-l5 .ht-hype-msg { color: #BF00FF; }

  /* ─── Giveaway Widget (persistent corner) ────────────── */
  #giveaway-widget {
    position: fixed;
    bottom: 30px; left: 30px;
    width: 220px;
    background: linear-gradient(155deg, #2A1508, #180C04);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s;
    box-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  #giveaway-widget.visible { opacity: 1; }

  .gw-title {
    font-family: 'Cinzel', serif;
    font-size: 10px; letter-spacing: .15em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 4px;
  }
  .gw-keyword {
    font-family: 'Crimson Pro', serif;
    font-size: 14px; font-weight: 600;
    color: var(--cream); margin-bottom: 4px;
  }
  .gw-count {
    font-family: 'Crimson Pro', serif;
    font-size: 11px; font-style: italic;
    color: var(--muted);
  }

  /* ─── Giveaway Winner Reveal (takeover) ──────────────── */
  #giveaway-reveal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(.9);
    width: 560px;
    text-align: center;
    background: linear-gradient(155deg, #2A1508, #180C04);
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 32px 24px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s, transform .4s;
    box-shadow: 0 0 60px var(--glow-rgba), 0 8px 40px rgba(0,0,0,.7);
    z-index: 50;
  }
  #giveaway-reveal.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .gr-title {
    font-family: 'Cinzel', serif;
    font-size: 16px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--amber); margin-bottom: 18px;
  }

  /* Slot-machine reel: a 3-row window, middle row is the payline */
  .gr-reel-window {
    position: relative;
    height: 168px; /* 3 × 56px rows — keep in sync with GIVEAWAY_ROW_H in JS */
    overflow: hidden;
    margin: 0 auto 14px;
    border-top: 2px solid var(--border);
    border-bottom: 2px solid var(--border);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 78%, transparent 100%);

<script>
// ─── Goal / Progress Circle ─────────────────────────────────────────────────────
const GOAL_CONFIG = {
  title:       'Stream Goal',   // Display name
  amount:      500,             // Target in dollars
  dungeonDive: null,            // Set to 'http://192.168.6.228:3001' to sync, or null for standalone
  pollInterval: 30000,          // How often to poll Dungeon Dive (ms)
};

let goalState = {
  bits:  0,  // dollars from bits (100 bits = $1)
  subs:  0,  // dollars from subs
  tips:  0,  // dollars from tips
};

function goalTotal() {
  return goalState.bits + goalState.subs + goalState.tips;
}

function updateGoalUI() {
  const total   = goalTotal();
  const goal    = GOAL_CONFIG.amount;
  const pct     = Math.min(total / goal, 1);
  const pctDisp = Math.round(pct * 100);

  // Circle stroke — circumference of r=60 circle = 2π×60 ≈ 377
  const CIRC = 377;
  const fill = document.getElementById('circle-fill');
  fill.style.strokeDashoffset = CIRC - pct * CIRC;

  // Color shift: amber → gold → warm as it fills
  const color = pct >= 1 ? '#F0C060' : pct >= 0.5 ? '#D4A840' : '#E89010';
  fill.style.stroke = color;

  // Pulse on completion
  if (pct >= 1) {
    fill.classList.remove('pulse');
    void fill.offsetWidth;
    fill.classList.add('pulse');
  }

  document.getElementById('goal-pct').textContent     = `${pctDisp}%`;
  document.getElementById('goal-title').textContent   = GOAL_CONFIG.title;
  document.getElementById('goal-amounts').textContent = `$${total.toFixed(2)} / $${goal.toFixed(2)}`;
  document.getElementById('bd-bits').textContent      = `♦ $${goalState.bits.toFixed(2)}`;
  document.getElementById('bd-subs').textContent      = `★ $${goalState.subs.toFixed(2)}`;
  document.getElementById('bd-tips').textContent      = `✦ $${goalState.tips.toFixed(2)}`;
}

// Add revenue to the goal (called by SSE events or manual)
function addGoalRevenue(type, amount) {
  const n = parseFloat(amount) || 0;
  if (type === 'bits')  goalState.bits += n / 100; // bits to dollars
  if (type === 'sub')   goalState.subs += subToDollars(n);
  if (type === 'resub') goalState.subs += subToDollars(n);
  if (type === 'giftsub') goalState.subs += subToDollars(n) * (n > 1 ? n : 1);
  if (type === 'tip')   goalState.tips += parseFloat(amount) || 0;
  saveGoalState();
  updateGoalUI();
}

// Streamer payout after Twitch 50/50 split
function subToDollars(tier) {
  if (tier >= 3) return 12.50;
  if (tier >= 2) return 5.00;
  return 3.00;
}

// Persist goal state in localStorage so it survives refreshes
function saveGoalState() {
  try { localStorage.setItem('nom-goal-state', JSON.stringify(goalState)); } catch (e) {}
}

function loadGoalState() {
  try {
    const saved = localStorage.getItem('nom-goal-state');
    if (saved) goalState = { ...goalState, ...JSON.parse(saved) };
  } catch (e) {}
}

// Optional: sync from Dungeon Dive server
async function syncFromDungeonDive() {
  if (!GOAL_CONFIG.dungeonDive) return;
  try {
    const res  = await fetch(`${GOAL_CONFIG.dungeonDive}/api/revenue`);
    const data = await res.json();
    if (data.bits  != null) goalState.bits = parseFloat(data.bits)  || 0;
    if (data.subs  != null) goalState.subs = parseFloat(data.subs)  || 0;
    if (data.tips  != null) goalState.tips = parseFloat(data.tips)  || 0;
    saveGoalState();
    updateGoalUI();
    console.log('[goal] Synced from Dungeon Dive');
  } catch (e) {
    console.log(`[goal] Dungeon Dive sync failed: ${e.message}`);
  }
}

// Hook into the SSE alert bus to auto-update goal on real events
const _origShowAlert = showAlert;
// We'll wrap showAlert after it's defined — see bottom of script

async function initGoal() {
  loadGoalState(); // load localStorage as fallback
  updateGoalUI();
  // Restore visibility preference
  try {
    const vis = localStorage.getItem('nom-goal-visible');
    if (vis === 'false') {
      const widget = document.getElementById('goal-widget');
      if (widget) widget.style.display = 'none';
    }
  } catch(e) {}
  // Fetch authoritative state from server
  const brokerBase = (typeof CONFIG !== 'undefined' && CONFIG.tokenBrokerUrl)
    ? CONFIG.tokenBrokerUrl.replace('/token', '')
    : 'http://192.168.6.228:3010';
  try {
    const res  = await fetch(`${brokerBase}/goal-state`);
    const data = await res.json();
    goalState.bits  = data.bits  || 0;
    goalState.subs  = data.subs  || 0;
    goalState.tips  = data.tips  || 0;
    if (data.title)  GOAL_CONFIG.title  = data.title;
    if (data.amount) GOAL_CONFIG.amount = data.amount;
    updateGoalUI();
    console.log('[goal] State loaded from server');
  } catch (e) {
    console.log(`[goal] Could not fetch server state: ${e.message}`);
  }
  if (GOAL_CONFIG.dungeonDive) {
    syncFromDungeonDive();
    setInterval(syncFromDungeonDive, GOAL_CONFIG.pollInterval);
  }
}

// ─── Health Tracker ─────────────────────────────────────────────────────────────
const HEALTH_CONFIG = {
  // Proxied through nom-token-broker to avoid CORS issues
  fitbitUrl:     ((typeof CONFIG !== 'undefined' && CONFIG.tokenBrokerUrl)
    ? CONFIG.tokenBrokerUrl.replace('/token', '')
    : 'http://192.168.6.228:3010') + '/health-data',
  pollInterval:  60000,   // poll every 60 seconds
  stepsGoal:     10000,
  waterGoal:     2000,    // ml
  showSteps:     true,
  showWater:     true,
};

let healthEnabled = { steps: true, water: true };

function updateTopLeftWidgetsVisibility() {
  const container  = document.getElementById('top-left-widgets');
  if (!container) return;
  const goalWidget = document.getElementById('goal-widget');
  const goalVisible = goalWidget && goalWidget.style.display !== 'none';
  const anyHealthVisible = healthEnabled.steps || healthEnabled.water;
  if (!goalVisible && !anyHealthVisible) {
    container.style.display = 'none';
  } else {
    container.style.display = '';
  }
}

function applyHealthSettings(settings) {
  // Load persisted settings
  try {
    const saved = localStorage.getItem('nom-health-settings');
    if (saved) Object.assign(healthEnabled, JSON.parse(saved));
  } catch (e) {}

  document.getElementById('steps-row').style.display = healthEnabled.steps ? 'flex' : 'none';
  document.getElementById('water-row').style.display = healthEnabled.water ? 'flex' : 'none';

  const widget = document.getElementById('health-widget');
  if (!healthEnabled.steps && !healthEnabled.water) {
    widget.classList.add('hidden');
  } else {
    widget.classList.remove('hidden');
  }
  updateTopLeftWidgetsVisibility();
}

function setHealthEnabled(type, enabled) {
  healthEnabled[type] = enabled;
  try { localStorage.setItem('nom-health-settings', JSON.stringify(healthEnabled)); } catch (e) {}
  applyHealthSettings();
}

function updateHealthUI(steps, water) {
  const stepsPct = Math.min((steps / HEALTH_CONFIG.stepsGoal) * 100, 100);
  const waterPct = Math.min((water / HEALTH_CONFIG.waterGoal) * 100, 100);

  document.getElementById('steps-fill').style.width  = stepsPct + '%';
  document.getElementById('water-fill').style.width  = waterPct + '%';
  document.getElementById('steps-value').textContent = `${steps.toLocaleString()} / 10K`;
  document.getElementById('water-value').textContent = `${water} / 2000ml`;
}

async function fetchHealthData() {
  try {
    const res  = await fetch(HEALTH_CONFIG.fitbitUrl);
    const data = await res.json();
    updateHealthUI(data.steps || 0, data.water || 0);
  } catch (e) {
    console.log(`[health] Fetch failed: ${e.message}`);
  }
}

function initHealth() {
  applyHealthSettings();
  fetchHealthData();
  setInterval(fetchHealthData, HEALTH_CONFIG.pollInterval);
}

// Also listen for health toggle via SSE from admin
// (handled in SSE onmessage below)

// ─── Poll Widget ─────────────────────────────────────────────────────────────
let pollTimerInterval = null;

function renderPoll(data) {
  const widget  = document.getElementById('poll-widget');
  const qEl     = document.getElementById('poll-question');
  const cEl     = document.getElementById('poll-choices');
  const sEl     = document.getElementById('poll-status');
  const tEl     = document.getElementById('poll-timer');

  qEl.textContent = data.title;

  const totalVotes = (data.choices || []).reduce((s, c) => s + (c.votes || 0), 0);

  cEl.innerHTML = (data.choices || []).map(c => {
    const votes = c.votes || 0;
    const pct   = totalVotes > 0 ? Math.round((votes / totalVotes) * 100) : 0;
    return `<div class="pw-choice">
      <div class="pw-choice-bar" style="width:${pct}%"></div>
      <div class="pw-choice-label">
        <span>${c.title}</span>
        <span>
          <span class="pw-choice-votes">${votes.toLocaleString()} votes</span>
          &nbsp;<span class="pw-choice-pct">${pct}%</span>
        </span>
      </div>
    </div>`;
  }).join('');

  if (data.status === 'completed' || data.status === 'terminated') {
    sEl.textContent = data.status === 'completed' ? 'ENDED' : 'CANCELLED';
    tEl.textContent = `${totalVotes.toLocaleString()} total votes`;
    clearInterval(pollTimerInterval);
    // Auto-hide after 10s
    setTimeout(() => widget.classList.remove('visible'), 10000);
  } else {
    sEl.textContent = 'ACTIVE';
    clearInterval(pollTimerInterval);
    if (data.endsAt) {
      pollTimerInterval = setInterval(() => {
        const secs = Math.max(0, Math.round((new Date(data.endsAt) - Date.now()) / 1000));
        tEl.textContent = secs > 0 ? `${secs}s remaining` : 'Ending...';
        if (secs === 0) clearInterval(pollTimerInterval);
      }, 1000);
    }
  }

  widget.classList.add('visible');

// ─── Prediction Widget ───────────────────────────────────────────────────────
let predTimerInterval = null;

function renderPrediction(data) {
  const widget  = document.getElementById('prediction-widget');
  const qEl     = document.getElementById('pred-question');
  const cEl     = document.getElementById('pred-choices');
  const sEl     = document.getElementById('pred-status');
  const tEl     = document.getElementById('pred-timer');

  qEl.textContent = data.title;

  const totalPoints = (data.outcomes || []).reduce((s, o) => s + (o.channel_points || 0), 0);
  const colors = ['blue', 'pink', 'blue', 'pink']; // alternating for multi-outcome

  cEl.innerHTML = (data.outcomes || []).map((o, i) => {
    const pts   = o.channel_points || 0;
    const users = o.users || 0;
    const pct   = totalPoints > 0 ? Math.round((pts / totalPoints) * 100) : 0;
    const isWinner = data.winningOutcomeId && data.winningOutcomeId === o.id;
    const color = colors[i] || 'blue';
    return `<div class="pw-choice ${color}${isWinner ? ' winner' : ''}">
      <div class="pw-choice-bar" style="width:${pct}%"></div>
      <div class="pw-choice-label">
        <span>${isWinner ? '👑 ' : ''}${o.title}</span>
        <span>
          <span class="pw-choice-votes">${pts.toLocaleString()} pts · ${users} users</span>
          &nbsp;<span class="pw-choice-pct">${pct}%</span>
        </span>
      </div>
    </div>`;
  }).join('');

  if (data.status === 'resolved' || data.status === 'canceled') {
    sEl.textContent = data.status === 'resolved' ? 'RESOLVED' : 'CANCELLED';
    tEl.textContent = `${totalPoints.toLocaleString()} total points`;
    clearInterval(predTimerInterval);
    setTimeout(() => widget.classList.remove('visible'), 12000);
  } else if (data.status === 'locked') {
    sEl.textContent = 'LOCKED';
    tEl.textContent = 'Awaiting result...';
    clearInterval(predTimerInterval);
  } else {
    sEl.textContent = 'ACTIVE';
    clearInterval(predTimerInterval);
    if (data.locksAt) {
      predTimerInterval = setInterval(() => {
        const secs = Math.max(0, Math.round((new Date(data.locksAt) - Date.now()) / 1000));
        tEl.textContent = secs > 0 ? `Locks in ${secs}s` : 'Locking...';
        if (secs === 0) clearInterval(predTimerInterval);
      }, 1000);
    }
  }

  widget.classList.add('visible');
  updateWidgetStacking();
}

// ─── Giveaway ──────────────────────────────────────────────────────────────
const GIVEAWAY_ROW_H     = 56;  // must match .gr-reel-item height in CSS
const GIVEAWAY_BEFORE    = 24;  // filler rows spun through before the winner
let   giveawayLandFn     = null; // current transitionend handler, so we can remove it on a new draw
let   giveawayHideTimer  = null; // pending "hide the winner badge" timeout, cleared if a new giveaway starts first

function renderGiveaway(data) {
  const widget    = document.getElementById('giveaway-widget');
  const keywordEl = document.getElementById('giveaway-keyword');
  const countEl   = document.getElementById('giveaway-count');
  const reveal    = document.getElementById('giveaway-reveal');
  const reel      = document.getElementById('giveaway-reel');
  const subEl     = document.getElementById('giveaway-reveal-sub');

  if (data.status === 'started' || data.status === 'active') {
    clearTimeout(giveawayHideTimer);
    keywordEl.textContent = `Type ${data.keyword} to win!`;
    countEl.textContent   = `${data.count || 0} entered`;
    widget.classList.add('visible');
    return;
  }

  if (data.status === 'stopped') {
    clearTimeout(giveawayHideTimer);
    countEl.textContent = `${data.count || 0} entered — entries closed`;
    return;
  }

  if (data.status === 'drawing') {
    clearTimeout(giveawayHideTimer);
    widget.classList.remove('visible');
    if (giveawayLandFn) reel.removeEventListener('transitionend', giveawayLandFn);

    const pool = (data.entries && data.entries.length) ? data.entries : [data.winner];
    subEl.textContent = `${data.count || pool.length} entries`;

    // Build the reel strip: random fillers, then the winner, then one trailing
    // filler so the window's bottom slot isn't empty once it lands.
    const strip = [];
    for (let i = 0; i < GIVEAWAY_BEFORE; i++) strip.push(pool[Math.floor(Math.random() * pool.length)]);
    const winnerIndex = strip.length;
    strip.push(data.winner);
    strip.push(pool[Math.floor(Math.random() * pool.length)]);

    reel.style.transition = 'none';
    reel.style.transform   = 'translateY(0px)';
    reel.innerHTML = strip.map(n => `<div class="gr-reel-item">${n}</div>`).join('');

    reveal.classList.add('visible');

    // Force a reflow so the 'none' transition above actually applies before
    // we re-enable it — otherwise the browser can coalesce both into one frame.
    void reel.offsetHeight;

    requestAnimationFrame(() => {
      const landY = (winnerIndex - 1) * GIVEAWAY_ROW_H; // centers winnerIndex in the 3-row window
      reel.style.transition = 'transform 3.2s cubic-bezier(0.1, 0.75, 0.15, 1)';
      reel.style.transform  = `translateY(-${landY}px)`;
    });

    giveawayLandFn = () => {
      reel.removeEventListener('transitionend', giveawayLandFn);
      giveawayLandFn = null;
      const rows = reel.querySelectorAll('.gr-reel-item');
      if (rows[winnerIndex]) rows[winnerIndex].classList.add('landed');
      subEl.textContent = '🏆 Winner!';
      spawnNoteBurst(5);
    };
    reel.addEventListener('transitionend', giveawayLandFn);

    setTimeout(() => {
      reveal.classList.remove('visible');
      keywordEl.textContent = `🏆 Winner: ${data.winner}`;
      countEl.textContent   = 'Congrats!';
      widget.classList.add('visible');

      // Sit on the winner badge a moment, then go back to normal.
      giveawayHideTimer = setTimeout(() => {
        widget.classList.remove('visible');
      }, 8000);
    }, 12000);
    return;
  }

  if (data.status === 'reset') {
    clearTimeout(giveawayHideTimer);
    if (giveawayLandFn) { reel.removeEventListener('transitionend', giveawayLandFn); giveawayLandFn = null; }
    widget.classList.remove('visible');
    reveal.classList.remove('visible');
    countEl.textContent = '0 entered';
    return;
  }
}

// ─── Music Notes ─────────────────────────────────────────────────────────────
const NOTE_SYMBOLS = ['♩','♪','♫','♬','𝄞','𝄢'];
let noteInterval = null;

const NOTE_CONFIG = {
  1: { count: 2,  interval: 2000, speed: 2.5 },
  2: { count: 4,  interval: 1400, speed: 2.0 },
  3: { count: 6,  interval: 900,  speed: 1.5 },
  4: { count: 9,  interval: 600,  speed: 1.0 },
  5: { count: 14, interval: 350,  speed: 0.6 },
};

function spawnNote(level) {
  const cfg  = NOTE_CONFIG[Math.min(level, 5)] || NOTE_CONFIG[1];
  const note = document.createElement('div');
  note.className = 'music-note';
  note.textContent = NOTE_SYMBOLS[Math.floor(Math.random() * NOTE_SYMBOLS.length)];

  // Random position anywhere on screen
  const x = Math.random() * (window.innerWidth - 40);
  const y = Math.random() * (window.innerHeight - 100) + 50;
  const spin = (Math.random() - 0.5) * 60;
  const size = 18 + Math.random() * 20 + (level * 3);

  // Color escalates with level
  const colors = {
    1: ['#E89010', '#F0C060'],
    2: ['#FF8C00', '#FFD050'],
    3: ['#FF4500', '#FF8C00'],
    4: ['#FF0080', '#FF4500'],
    5: ['#BF00FF', '#FF0080'],
  };
  const palette = colors[Math.min(level, 5)];
  const color   = palette[Math.floor(Math.random() * palette.length)];

  note.style.cssText = `
    left: ${x}px;
    top: ${y}px;
    font-size: ${size}px;
    color: ${color};
    text-shadow: 0 0 ${6 + level * 3}px ${color};
    --note-spin: ${spin}deg;
    animation-duration: ${cfg.speed + Math.random() * 0.5}s;
  `;

  document.body.appendChild(note);
  note.addEventListener('animationend', () => note.remove());
}

function spawnNoteBurst(level) {
  const cfg = NOTE_CONFIG[Math.min(level, 5)] || NOTE_CONFIG[1];
  for (let i = 0; i < cfg.count; i++) {
    setTimeout(() => spawnNote(level), i * (cfg.interval / cfg.count * 0.3));
  }
}

function startNotes(level) {
  stopNotes();
  const cfg = NOTE_CONFIG[Math.min(level, 5)] || NOTE_CONFIG[1];
  spawnNoteBurst(level); // immediate burst on start
  noteInterval = setInterval(() => spawnNoteBurst(level), cfg.interval);
}

function stopNotes() {
  clearInterval(noteInterval);
  noteInterval = null;
}

];

let socialConfigH  = [...DEFAULT_SOCIAL_CONFIG_H];
let socialIndexH   = 0;
let socialTimeoutH = null;

async function initSocialScrollerH() {
  try {
    const res  = await fetch(`${TOKEN_BROKER_BASE}/social-config`);
    const data = await res.json();
    if (Array.isArray(data) && data.length) socialConfigH = data;
  } catch(e) {}
  runSocialScrollerH();
}

function runSocialScrollerH() {
  const entries = socialConfigH.filter(e => e.enabled);
  if (!entries.length) return;
  if (socialIndexH >= entries.length) socialIndexH = 0;
  showSocialEntryH(entries[socialIndexH]);
  socialIndexH = (socialIndexH + 1) % entries.length;
}

function showSocialEntryH(entry) {
  const el       = document.getElementById('social-entry-h');
  const iconWrap = document.getElementById('social-icon-h').parentElement;
  const iconEl   = document.getElementById('social-icon-h');
  const handleEl = document.getElementById('social-handle-h');

  const isUrl = entry.icon && entry.icon.startsWith('http');
  if (isUrl) {
    iconEl.style.display = '';
    iconEl.src = entry.icon;
    iconEl.removeAttribute('data-emoji');
  } else if (entry.icon) {
    // Emoji icon — swap <img> for a text node via a sibling span
    iconEl.style.display = 'none';
    let emojiSpan = iconWrap.querySelector('.social-emoji-h');
    if (!emojiSpan) {
      emojiSpan = document.createElement('span');
      emojiSpan.className = 'social-emoji-h';
      emojiSpan.style.fontSize = '32px';
      emojiSpan.style.lineHeight = '1';
      iconWrap.insertBefore(emojiSpan, iconEl);
    }
    emojiSpan.textContent = entry.icon;
    emojiSpan.style.display = '';
  } else {
    // No icon at all
    iconEl.style.display = 'none';
    const emojiSpan = iconWrap.querySelector('.social-emoji-h');
    if (emojiSpan) emojiSpan.style.display = 'none';
  }

  handleEl.textContent = entry.handle || '';

  el.classList.remove('bounce-in', 'bounce-out');
  void el.offsetWidth;
  el.classList.add('bounce-in');

  socialTimeoutH = setTimeout(() => {
    el.classList.remove('bounce-in');
    el.classList.add('bounce-out');
    setTimeout(() => {
      el.classList.remove('bounce-out');
      runSocialScrollerH();
    }, 420);
  }, 5000);
}

function reloadSocialConfigH(data) {
  if (Array.isArray(data)) {
    socialConfigH = data;
    socialIndexH  = 0;
    clearTimeout(socialTimeoutH);
    const el = document.getElementById('social-entry-h');
    el.classList.remove('bounce-in', 'bounce-out');
    runSocialScrollerH();
  }
}

// ─── Shoutout Config ───────────────────────────────────────────────────────────
// Used for the chat !so fallback to call Twitch Helix API.
// Paste a token from get-token.html — only needed if Streamer.bot path isn't working.
// Token and clientId are fetched from the broker at startup
let TWITCH_TOKEN     = null;
let TWITCH_CLIENT_ID = null;

async function initTwitchToken() {
  const brokerUrl = (typeof CONFIG !== 'undefined' && CONFIG.tokenBrokerUrl)
    ? CONFIG.tokenBrokerUrl
    : 'http://127.0.0.1:3010/token';
  try {
    const res  = await fetch(brokerUrl);
    const data = await res.json();
    if (data.token) {
      TWITCH_TOKEN     = data.token;
      TWITCH_CLIENT_ID = data.clientId;
      console.log('[twitch token] Loaded from broker ✓');
    } else {
      console.log(`[twitch token] Broker error: ${data.message || JSON.stringify(data)}`);
    }
  } catch (e) {
    console.log(`[twitch token] Could not reach broker: ${e.message}`);
  }
}

initTwitchToken();

// Moderators/VIPs allowed to use !so from chat (lowercase). Empty = broadcaster only.
const SO_ALLOWED_ROLES = ['moderator', 'broadcaster', 'vip'];
// Cooldown in ms to prevent spam
let   soCooldown = false;

async function fetchShoutoutData(username) {
  if (!TWITCH_TOKEN) {
    console.log('[shoutout] No token set — cannot fetch from Twitch API');
    return { profileUrl: null, game: 'Unknown' };
  }
  try {
    const headers = {
      'Client-ID':     TWITCH_CLIENT_ID,
      'Authorization': `Bearer ${TWITCH_TOKEN}`,
    };
    // Get user
    const userRes  = await fetch(`https://api.twitch.tv/helix/users?login=${encodeURIComponent(username)}`, { headers });
    const userData = await userRes.json();
    const user     = userData.data?.[0];
    if (!user) return { profileUrl: null, game: 'Unknown' };

    // Get channel (last game)
    const chanRes  = await fetch(`https://api.twitch.tv/helix/channels?broadcaster_id=${user.id}`, { headers });
    const chanData = await chanRes.json();
    const game     = chanData.data?.[0]?.game_name || 'something awesome';

    return { profileUrl: user.profile_image_url, game };
  } catch (e) {
    console.log(`[shoutout] API error: ${e.message}`);
    return { profileUrl: null, game: 'Unknown' };
  }
}

async function fireShoutout(username, profileUrl, game) {
  if (soCooldown) { console.log('[shoutout] On cooldown, skipping'); return; }
  soCooldown = true;
  setTimeout(() => soCooldown = false, 10000);

  // If no profileUrl provided, fetch from API
  if (!profileUrl) {
    const data = await fetchShoutoutData(username);
    profileUrl = data.profileUrl;
    game       = game || data.game;
  }

  console.log(`[shoutout: ${username} | game: ${game}]`);

  // Temporarily override config for this alert
  CONFIGS.shoutout.iconUrl  = () => profileUrl;
  CONFIGS.shoutout.sub      = () => game ? `They were last playing: ${game}` : 'Go show them some love!';

  showAlert('shoutout', username, null, null);
}

async function fireRaidOut(username, viewers) {
  const data = await fetchShoutoutData(username);
  const game = data.game;
  CONFIGS.raid_out.iconUrl = () => data.profileUrl || 'Assets/raid.gif';
  CONFIGS.raid_out.sub = () => (game && game !== 'Unknown')
    ? `Now catching ${game} live!`
    : 'Take the party to their tavern!';
  showAlert('raid_out', username, viewers, null);
}

const SOUNDS = {
  follow:  'Assets/Sounds/New-Follower.wav',
  sub:     'Assets/Sounds/Sub-song.wav',
  resub:   'Assets/Sounds/Sub-song.wav',
  giftsub: 'Assets/Sounds/Sub-song.wav',

// Special sound overrides based on amount
const SOUND_OVERRIDES = {
  bits: (amount) => {
    if (Number(amount) === 69) return 'Assets/Sounds/69-bits.mp3';
    return null;
  },
};

const SOUND_VOLUME = (typeof CONFIG !== 'undefined' && CONFIG.soundVolume != null) ? CONFIG.soundVolume : 0.8;

// Preload all sounds on startup so they're ready to fire instantly
const audioCache = {};
function preloadSounds() {
  for (const [type, src] of Object.entries(SOUNDS)) {
    if (!src) continue;
    const audio = new Audio(src);
    audio.volume = SOUND_VOLUME;
    audio.load();
    audioCache[type] = audio;
  }
  // Preload override sounds too
  const overrideSrcs = new Set();
  for (const fn of Object.values(SOUND_OVERRIDES)) {
    // Sample a few values to find override paths
    [69].forEach(v => { const s = fn(v); if (s) overrideSrcs.add(s); });
  }
  for (const src of overrideSrcs) {
    const audio = new Audio(src);
    audio.volume = SOUND_VOLUME;
    audio.load();
  }
}

function playAlertSound(type, amount) {
  // Check for special overrides first
  let src = null;
  if (SOUND_OVERRIDES[type]) src = SOUND_OVERRIDES[type](amount);
  const isOverride = !!src;
  if (!src) src = SOUNDS[type];
  if (!src) return;

  if (isOverride) {
    const audio = new Audio(src);
    audio.volume = SOUND_VOLUME;
    audio.play().catch(e => console.log(`[sound error: ${e.message}]`));
    return;
  }

  let audio = audioCache[type];
  if (!audio) {
    audio = new Audio(src);
    audio.volume = SOUND_VOLUME;
    audioCache[type] = audio;
  }
  audio.currentTime = 0;
  audio.volume = SOUND_VOLUME;
  audio.play().catch(e => console.log(`[sound error: ${e.message}]`));
}

// ─── Queue ─────────────────────────────────────────────────────────────────
let queue   = [];
let running = false;

let alertsPaused = false;

function showAlert(type, username = 'ChatUser', amount = null, message = null, goal = null) {
  if (alertsPaused) {
    console.log(`[panic] Alerts paused — dropped: ${type} from ${username}`);
    return;
  }
  queue.push({ type, username, amount, message, goal });
  updateQueueInfo();
  if (!running) next();
}

function next() {
  if (!queue.length) { running = false; updateQueueInfo(); return; }
  running = true;
  const item = queue.shift();
  updateQueueInfo();
  renderAlert(item);
}

// ─── Render ────────────────────────────────────────────────────────────────
function autoSizeText(el, minPx, maxPx) {
  el.style.fontSize = maxPx + 'px';
  el.style.whiteSpace = 'nowrap';
  const parent = el.closest('.card') || el.parentElement;
  if (!parent) return;
  const available = parent.clientWidth - 160; // subtract icon + padding
  while (el.scrollWidth > available && parseFloat(el.style.fontSize) > minPx) {
    el.style.fontSize = (parseFloat(el.style.fontSize) - 1) + 'px';
  }
  if (parseFloat(el.style.fontSize) <= minPx) {
    el.style.whiteSpace = 'normal'; // wrap as last resort
  }
}

function renderAlert({ type, username, amount, message, goal }) {
  const cfg = CONFIGS[type] || CONFIGS.follow;
  const card = document.getElementById('card');

  // Update text
  const iconEl = document.getElementById('icon');
  if (cfg.iconUrl) {
    const url = cfg.iconUrl(amount);
    if (url) {
      const isProfile = (type === 'shoutout' || type === 'raid_out') && !url.startsWith('Assets');
      const style = isProfile
        ? 'width:48px;height:48px;object-fit:cover;border-radius:50%;border:2px solid var(--border);'
        : 'width:44px;height:44px;object-fit:contain;';
      iconEl.innerHTML = `<img src="${url}" style="${style}" alt="${type}">`;
    } else {
      iconEl.textContent = '📣';
    }
  } else {
    iconEl.textContent = cfg.icon;
  }
  document.getElementById('label').textContent  = cfg.label;
  document.getElementById('label').style.color  = cfg.color;
  // Shoutouts: two-line layout — "Give some love to" then big username
  if (type === 'shoutout') {
    const whoEl    = document.getElementById('who');
    const actionEl = document.getElementById('action');
    const headline = document.querySelector('.headline');
    // Flip order: action (small) on top, who (big) below
    headline.style.flexDirection = 'column-reverse';
    whoEl.textContent      = username;
    whoEl.style.display    = 'block';
    whoEl.style.fontSize   = 'clamp(14px, 3vw, 22px)';
    whoEl.style.fontWeight = '700';
    whoEl.style.marginTop  = '0';
    actionEl.textContent   = 'Give some love to';
    actionEl.style.display = 'block';
    actionEl.style.fontSize = '11px';
    actionEl.style.opacity  = '0.7';
    actionEl.style.fontStyle = 'italic';
  } else {
    // Two-line layout: username (big, bold) on top, action text (small, italic) below
    const headline = document.querySelector('.headline');
    if (headline) headline.style.flexDirection = 'column';

    const whoEl    = document.getElementById('who');
    const actionEl = document.getElementById('action');

    // Username — big and bold on top
    whoEl.textContent      = username;
    whoEl.style.color      = cfg.color;
    whoEl.style.display    = 'block';
    whoEl.style.fontSize   = 'clamp(14px, 2vw, 22px)';
    whoEl.style.fontWeight = '700';
    whoEl.style.marginTop  = '0';

    // Action — small italic below username
    const fullAction = cfg.action(username, amount);
    const actionPart = fullAction.replace(username, '').trim();
    actionEl.textContent    = actionPart;
    actionEl.style.display  = 'block';
    actionEl.style.fontSize = '12px';
    actionEl.style.opacity  = '0.8';
    actionEl.style.fontStyle = 'italic';
    actionEl.style.color    = '';
  }

  // Clear sub text — action line tells the full story
  document.getElementById('sub').textContent = '';

  const subText = typeof cfg.sub === 'function' ? cfg.sub(username, amount) : cfg.sub;
  // Show sub text for shoutouts and outgoing raids (game info) — action line covers other alerts
  if (type === 'shoutout' || type === 'raid_out') {
    document.getElementById('sub').textContent = subText || '';
  } else {
    document.getElementById('sub').textContent = '';
  }

  // Optional message
  const msgEl = document.getElementById('message');
  const divEl = document.getElementById('divider');
  if (message) {
    msgEl.textContent = `"${message}"`;
    msgEl.style.display = 'block';
    divEl.style.display = 'block';
  } else {
    msgEl.style.display = 'none';
    divEl.style.display = 'none';
  }

  // Channel goal bar
  const goalBar = document.getElementById('channel-goal-bar');
  if (goal && goalBar) {
    const pct = goal.target > 0 ? Math.min((goal.current / goal.target) * 100, 100) : 0;
    goalBar.style.display = '';
    document.getElementById('channel-goal-label').textContent =
      goal.description || (goal.type === 'follower' ? 'Follower Goal' : 'Subscriber Goal');
    document.getElementById('channel-goal-count').textContent =
      `${goal.current.toLocaleString()} / ${goal.target.toLocaleString()}`;
    document.getElementById('channel-goal-fill').style.width = pct + '%';
  } else if (goalBar) {
    goalBar.style.display = 'none';
  }

  // Glow
  document.getElementById('card-glow').style.boxShadow =
    `0 0 28px ${cfg.color}44, 0 0 60px ${cfg.color}22, inset 0 0 16px ${cfg.color}0A`;

  // CSS variable for waveform colour & progress duration
  document.documentElement.style.setProperty('--wave-color', cfg.color);

  // Waveform
  buildWaveform(14, cfg.color);

  // Floating notes
  spawnNotes(10);

  // Progress bar — meaningless for a card with no auto-hide, so hide it
  const prog = document.getElementById('progress');
  if (type === 'raid_out') {
    prog.style.display = 'none';
  } else {
    prog.style.display = '';
    prog.style.animation = 'none';
    void prog.offsetWidth;
    prog.style.setProperty('--pdur', cfg.dur + 'ms');
    prog.style.animation = '';
  }

  // Sound
  playAlertSound(type, amount);

  // Show
  card.classList.remove('enter', 'exit');
  void card.offsetWidth;
  card.classList.add('enter');

  // Outgoing raid is a parting shot — pin it up through the rest of the
  // stream instead of auto-advancing the queue. Cleared via the admin
  // panel's "Clear Raid Card" button (or the panic button).
  if (type === 'raid_out') {
    raidCardPinned = true;
    return;
  }

  setTimeout(() => {
    card.classList.remove('enter');
    card.classList.add('exit');
    setTimeout(() => {
      card.classList.remove('exit');
      next();
    }, 420);
  }, cfg.dur);
}

let raidCardPinned = false;

function clearRaidCard() {
  if (!raidCardPinned) return;
  raidCardPinned = false;
  const card = document.getElementById('card');
  card.classList.remove('enter');
  card.classList.add('exit');
  setTimeout(() => {
    card.classList.remove('exit');
    document.getElementById('progress').style.display = '';
    next();
  }, 420);
}

// ─── Waveform Builder ──────────────────────────────────────────────────────
function buildWaveform(count, color) {
  const wf = document.getElementById('waveform');
  wf.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const lo  = 4  + Math.random() * 8;
    const hi  = 16 + Math.random() * 26;
    const dur = 0.3 + Math.random() * 0.45;
    const dly = (i / count) * 0.45;
    bar.style.setProperty('--lo',  lo  + 'px');
    bar.style.setProperty('--hi',  hi  + 'px');
    bar.style.setProperty('--dur', dur + 's');
    bar.style.setProperty('--dly', dly + 's');
    bar.style.background = `linear-gradient(to top, ${color}88, ${color})`;
    wf.appendChild(bar);
  }
}

// ─── Admin Alert Bus (SSE) ─────────────────────────────────────────────────────
// Listens for alerts fired from admin.html via server's /fire-alert endpoint
function connectAlertBus() {
  const brokerBase = (typeof CONFIG !== 'undefined' && CONFIG.tokenBrokerUrl)
    ? CONFIG.tokenBrokerUrl.replace('/token', '')
    : 'http://192.168.6.228:3010';

  const sseUrl = `${brokerBase}/alerts-stream`;
  console.log(`[alert bus] Connecting to ${sseUrl}`);

  const es = new EventSource(sseUrl);

  es.onopen = () => {
    console.log('[alert bus] SSE connection open');
  };

  es.onmessage = (e) => {
    let payload;
    try { payload = JSON.parse(e.data); } catch { return; }
    if (payload.type === 'connected') {
      console.log('[alert bus] Connected to server SSE ✓');
      return;
    }
    // Hype train update
    if (payload.type === 'hype_train') {
      renderHypeTrain(payload);
      return;
    }

    // Poll update
    if (payload.type === 'poll') {
      renderPoll(payload);
      return;
    }

    // Prediction update
    if (payload.type === 'prediction') {
      renderPrediction(payload);
      return;
    }

    // Giveaway update
    if (payload.type === 'giveaway') {
      renderGiveaway(payload);
      return;
    }

    // Social config update
    if (payload.type === 'social-scroller-toggle') {
      const scroller = document.getElementById('social-scroller');
      if (scroller) scroller.style.display = payload.enabled ? '' : 'none';
      return;
    }
    if (payload.type === 'social-config') {
      reloadSocialConfigH(payload.config);
      return;
    }

    // Panic button — pause/resume all alerts
    if (payload.type === 'alerts-paused') {
      alertsPaused = !!payload.paused;
      if (alertsPaused) {
        queue.length = 0; // clear any pending alerts immediately
        updateQueueInfo();
        clearRaidCard();
      }
      console.log(`[panic] Alerts ${alertsPaused ? 'PAUSED' : 'resumed'}`);
      return;
    }

    // Manually dismiss a pinned outgoing-raid card
    if (payload.type === 'clear-raid-card') {
      clearRaidCard();
      return;
    }

    // Theme switch
    if (payload.type === 'theme-switch') {
      applyTheme(payload.theme);
      return;
    }

    // Goal visibility toggle
    if (payload.type === 'goal-toggle') {
      const widget = document.getElementById('goal-widget');
      if (widget) widget.style.display = payload.visible ? '' : 'none';
      try { localStorage.setItem('nom-goal-visible', payload.visible); } catch(e) {}
      updateTopLeftWidgetsVisibility();
      return;
    }

    // Health toggle from admin
    if (payload.type === 'health-toggle') {
      if (payload.tracker === 'steps') setHealthEnabled('steps', payload.enabled);
      if (payload.tracker === 'water') setHealthEnabled('water', payload.enabled);
      return;
    }

    // Goal state update from server
    if (payload.type === 'goal-update' && payload.goal) {
      const g = payload.goal;
      goalState.bits  = g.bits  || 0;
      goalState.subs  = g.subs  || 0;
      goalState.tips  = g.tips  || 0;
      if (g.title)  GOAL_CONFIG.title  = g.title;
      if (g.amount) GOAL_CONFIG.amount = g.amount;
      updateGoalUI();
      return;
    }
    if (payload.type === 'shoutout') {
      fireShoutout(payload.username, payload.profileUrl || null, payload.game || null);
    } else if (payload.type === 'raid_out') {
      fireRaidOut(payload.username || 'Someone', payload.amount ?? null);
    } else if (payload.type) {
      // trackGoal=true only for real events coming from Twitch EventSub (not admin test fires)
      const isReal = payload._real === true;
      showAlertWithGoal(payload.type, payload.username || 'Someone', payload.amount ?? null, payload.message ?? null, isReal, payload.goal ?? null);
    }
  };

  es.onerror = (e) => {
    console.log(`[alert bus] SSE error — readyState: ${es.readyState} (0=connecting, 1=open, 2=closed)`);
  };
}

connectAlertBus();

// ─── Streamer.bot WebSocket ─────────────────────────────────────────────────
const SB_URL  = (typeof CONFIG !== 'undefined' && CONFIG.streamerbotUrl) ? CONFIG.streamerbotUrl : 'ws://127.0.0.1:8080';
// Split into two subscriptions so Fourthwall can't break Twitch events
const SB_SUB_TWITCH = {
  request: 'Subscribe',
  id:      'nom-alerts-twitch',
  events: {
    Twitch: ['Follow','Cheer','Sub','ReSub','GiftSub','GiftBomb','Raid','ChatMessage','TwitchWatchStreak','RewardRedemption'],
  },
};

const SB_SUB_FOURTHWALL = {
  request: 'Subscribe',
  id:      'nom-alerts-fourthwall',
  events: {
    Fourthwall: ['Donation'],
    YouTube:    ['NewSubscriber','SuperChat','SuperSticker','NewSponsor','MemberMileStone','MembershipGift','GiftMembershipReceived'],
  },
};

let   ws           = null;
let   reconnectMs  = 2000;
const MAX_RECONNECT = 30000;

function sbConnect() {
  ws = new WebSocket(SB_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify(SB_SUB_TWITCH));
    ws.send(JSON.stringify(SB_SUB_FOURTHWALL));
    console.log(`[connected to streamerbot: ${SB_URL}]`);
    setStatus('connected');
    reconnectMs = 2000;
  };

  ws.onmessage = ({ data }) => {
    let msg;
    try { msg = JSON.parse(data); } catch { return; }

    const src  = msg?.event?.source;
    const type = msg?.event?.type;
    const d    = msg?.data ?? {};

    // Subscription acknowledgements
    if (msg.status === 'ok' && msg.id?.startsWith('nom-alerts')) {
      console.log(`[subscribed: ${msg.id}]`);
      return;
    }
    if (msg.status === 'error' && msg.id?.startsWith('nom-alerts')) {
      console.log(`[subscription failed: ${msg.id} — ${JSON.stringify(msg)}]`);
      return;
    }

    // ── Fourthwall ──────────────────────────────────────────
    if (src === 'Fourthwall' && type === 'Donation') {
      const name   = d.customerName || d.displayName || d.userName || 'A Kind Soul';
      const amount = d.amount != null ? (d.amount / 100) : null;
      const msg2   = d.message || null;
      console.log(`[${name} tipped $${parseFloat(amount).toFixed(2)}]`);
      showAlertWithGoal('tip', name, amount, msg2, true);
      return;
    }

    // ── Channel Point Redemptions ────────────────────────────
    if (src === 'Twitch' && type === 'RewardRedemption') {
      const rewardTitle = d.reward?.title || d.rewardTitle || '';
      if (rewardTitle.includes('Daily check-in') || rewardTitle.includes('Daily Check-In')) {
        const name = d.user_name || d.user?.name || d.userName || 'Someone';
        console.log(`[redemption] ${name} redeemed: ${rewardTitle}`);
        showAlert('daily_checkin', name, null, null);
        return;
      }
      return;
    }

    // ── Watch Streak ─────────────────────────────────────────
    if (src === 'Twitch' && type === 'TwitchWatchStreak') {
      const name   = d.user || d.userName || 'Someone';
      const streak = d.watchStreak || d.streak || '?';
      console.log(`[watch streak] ${name} — streak: ${streak}`);
      showAlert('watch_streak', name, streak, null);
      return;
    }

    if (src !== 'Twitch') return;

    // All Twitch events nest the user object under d.user
    const name = d.user?.name || d.user?.login || 'Someone';

    switch (type) {
      case 'Follow':
        console.log(`[${name} followed]`);
        showAlert('follow', name, null, null);
        break;

      case 'Cheer': {
        const bits = d.bits ?? null;
        console.log(`[${name} cheered ${bits} bits]`);
        showAlert('bits', name, bits, d.text ?? null);
        break;
      }

      case 'Sub': {
        const tier = tierNum(d.sub_tier);
        console.log(`[${name} subscribed (tier ${tier})]`);
        showAlert('sub', name, tier, null);
        break;
      }

      case 'ReSub': {
        const months = d.cumulativeMonths ?? null;
        console.log(`[${name} resubscribed (${months} months)]`);
        showAlert('resub', name, months, d.text ?? null);
        break;
      }

      case 'GiftSub':
        console.log(`[${name} gifted a sub to ${d.recipient?.name ?? 'someone'}]`);
        showAlert('giftsub', name, 1, null);
        break;

      case 'GiftBomb': {
        const count = d.total ?? null;
        console.log(`[${name} gifted ${count} subs]`);
        showAlert('giftsub', name, count, null);
        break;
      }

      case 'Raid': {
        const viewers = d.viewers ?? d.viewerCount ?? null;
        console.log(`[${name} raided with ${viewers} viewers]`);
        showAlert('raid', name, viewers, null);
        break;
      }
    }
  };

  ws.onerror = () => {};
  ws.onclose = (ev) => {
    console.log(`[disconnected from streamerbot (code:${ev.code}) — retrying in ${reconnectMs}ms]`);
    setStatus('disconnected');
    setTimeout(sbConnect, reconnectMs);
    reconnectMs = Math.min(reconnectMs * 1.5, MAX_RECONNECT);
  };
}

// Twitch tier "1000"/"2000"/"3000" → 1/2/3
function tierNum(tier) {
  const t = parseInt(tier, 10);
  if (t >= 3000) return 3;
  if (t >= 2000) return 2;
  return 1;
}

// Status — overlay only logs to console, admin.html shows UI status
function setStatus(state) {
  console.log(`[streamerbot: ${state}]`);
}

sbConnect();

// ─── OBS Mode ──────────────────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
if (params.get('obs') === '1') {
  document.getElementById('test-panel').style.display = 'none';
}
if (params.get('test')) {
  setTimeout(() => test(params.get('test')), 800);
}

// ─── Public API (fallback — callable from OBS Execute JavaScript too) ───────
window.showAlert = showAlert;

// ─── Hook goal tracking into alert display ────────────────────────────────
const _showAlertOrig = showAlert;
// trackGoal=true only for real Twitch/Fourthwall events, not test fires
function showAlertWithGoal(type, username, amount, message, trackGoal = false, goal = null) {
  if (trackGoal) addGoalRevenue(type, amount);
  _showAlertOrig(type, username, amount, message, goal);
}
window.showAlert = showAlertWithGoal;

initGoal();
initHealth();
setTimeout(updateTopLeftWidgetsVisibility, 500);
// Fetch social scroller enabled state on load
(async function() {
  const base = (typeof CONFIG !== 'undefined' && CONFIG.tokenBrokerUrl)
    ? CONFIG.tokenBrokerUrl.replace('/token', '')
    : 'http://192.168.6.228:3010';
  try {
    const res  = await fetch(`${base}/social-scroller-state`);
    const data = await res.json();
    if (data.enabled === false) {
      const scroller = document.getElementById('social-scroller');
      if (scroller) scroller.style.display = 'none';
    }
  } catch(e) {}
})();
initSocialScrollerH();

// Fetch panic state on load in case overlay refreshed mid-pause
(async function checkPanicState() {
  const base = (typeof CONFIG !== 'undefined' && CONFIG.tokenBrokerUrl)
    ? CONFIG.tokenBrokerUrl.replace('/token', '')
    : 'http://192.168.6.228:3010';
  try {
    const res  = await fetch(`${base}/alerts-paused-state`);
    const data = await res.json();
    alertsPaused = !!data.paused;
    if (alertsPaused) console.log('[panic] Alerts loaded as PAUSED');
  } catch(e) {}
})();
</script>
