<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NOM Alerts Settings</title>
  <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Server URL">
    <sdpi-textfield
      setting="serverUrl"
      global
      placeholder="http://192.168.6.228:3010"
    ></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="">
    <span style="opacity:.6;font-size:11px;">
      Shared across every NOM Alerts button. Leave blank to use the default (http://192.168.6.228:3010).
    </span>
  </sdpi-item>
</body>
</html>
